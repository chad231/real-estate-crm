</head>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// ---------- small helpers ----------
const money = (n) => (n || n === 0) ? "$" + Number(n).toLocaleString() : "";
const cls = (...a) => a.filter(Boolean).join(" ");

function Field({ label, ...props }) {
  return (
    <label className="block text-sm">
      <span className="text-slate-600">{label}</span>
      <input {...props} className="mt-1 w-full rounded border border-slate-300 px-2 py-1.5 text-sm focus:border-indigo-500 focus:outline-none" />
    </label>
  );
}
function Select({ label, options, ...props }) {
  return (
    <label className="block text-sm">
      <span className="text-slate-600">{label}</span>
      <select {...props} className="mt-1 w-full rounded border border-slate-300 px-2 py-1.5 text-sm bg-white">
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </label>
  );
}

// ---------- login ----------
function Login() {
  const [email, setEmail] = useState("");
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState("");
  const send = async () => {
    setErr("");
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
    if (error) setErr(error.message); else setSent(true);
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="w-full max-w-sm bg-white rounded-xl shadow p-6">
        <h1 className="text-xl font-bold text-slate-800">Real Estate CRM</h1>
        <p className="text-sm text-slate-500 mt-1">Sign in with your email — we'll send a magic link.</p>
        {sent ? (
          <p className="mt-4 text-sm text-green-700 bg-green-50 rounded p-3">Check your inbox and click the link to sign in.</p>
        ) : (
          <div className="mt-4 space-y-3">
            <Field label="Email" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@email.com" />
            <button onClick={send} className="w-full rounded bg-indigo-600 text-white py-2 text-sm font-medium hover:bg-indigo-700">Send magic link</button>
            {err && <p className="text-sm text-red-600">{err}</p>}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- generic data hook ----------
function useTable(name) {
  const [rows, setRows] = useState([]);
  const load = async () => {
    const { data } = await sb.from(name).select("*").order("created_at", { ascending: false });
    setRows(data || []);
  };
  useEffect(() => { load(); }, []);
  const add = async (row) => { await sb.from(name).insert(row); load(); };
  const update = async (id, patch) => { await sb.from(name).update(patch).eq("id", id); load(); };
  const remove = async (id) => { await sb.from(name).delete().eq("id", id); load(); };
  return { rows, add, update, remove, reload: load };
}

// ---------- Contacts ----------
function Contacts() {
  const { rows, add, remove } = useTable("contacts");
  const [f, setF] = useState({ name: "", email: "", phone: "", type: "lead", status: "new", notes: "" });
  const submit = () => { if (!f.name) return; add(f); setF({ name: "", email: "", phone: "", type: "lead", status: "new", notes: "" }); };
  return (
    <div className="grid md:grid-cols-3 gap-5">
      <div className="bg-white rounded-xl shadow p-4 space-y-3">
        <h3 className="font-semibold text-slate-800">Add contact</h3>
        <Field label="Name" value={f.name} onChange={e => setF({ ...f, name: e.target.value })} />
        <Field label="Email" value={f.email} onChange={e => setF({ ...f, email: e.target.value })} />
        <Field label="Phone" value={f.phone} onChange={e => setF({ ...f, phone: e.target.value })} />
        <Select label="Type" options={["lead", "buyer", "seller"]} value={f.type} onChange={e => setF({ ...f, type: e.target.value })} />
        <Select label="Status" options={["new", "active", "closed"]} value={f.status} onChange={e => setF({ ...f, status: e.target.value })} />
        <Field label="Notes" value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} />
        <button onClick={submit} className="w-full rounded bg-indigo-600 text-white py-2 text-sm font-medium hover:bg-indigo-700">Save</button>
      </div>
      <div className="md:col-span-2 space-y-2">
        {rows.length === 0 && <p className="text-slate-400 text-sm">No contacts yet.</p>}
        {rows.map(r => (
          <div key={r.id} className="bg-white rounded-lg shadow-sm p-3 flex items-start justify-between">
            <div>
              <div className="font-medium text-slate-800">{r.name}
                <span className="ml-2 text-xs rounded-full bg-slate-100 px-2 py-0.5 text-slate-600">{r.type}</span>
                <span className="ml-1 text-xs rounded-full bg-indigo-50 px-2 py-0.5 text-indigo-600">{r.status}</span>
              </div>
              <div className="text-sm text-slate-500">{[r.email, r.phone].filter(Boolean).join(" · ")}</div>
              {r.notes && <div className="text-sm text-slate-400 mt-1">{r.notes}</div>}
            </div>
            <button onClick={() => remove(r.id)} className="text-slate-300 hover:text-red-500 text-sm">✕</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- Properties ----------
function Properties() {
  const { rows, add, remove } = useTable("properties");
  const blank = { address: "", city: "", state: "", zip: "", price: "", status: "active", beds: "", baths: "", sqft: "", notes: "" };
  const [f, setF] = useState(blank);
  const submit = () => {
    if (!f.address) return;
    add({ ...f, price: f.price || null, beds: f.beds || null, baths: f.baths || null, sqft: f.sqft || null });
    setF(blank);
  };
  return (
    <div className="grid md:grid-cols-3 gap-5">
      <div className="bg-white rounded-xl shadow p-4 space-y-3">
        <h3 className="font-semibold text-slate-800">Add property</h3>
        <Field label="Address" value={f.address} onChange={e => setF({ ...f, address: e.target.value })} />
        <div className="grid grid-cols-3 gap-2">
          <Field label="City" value={f.city} onChange={e => setF({ ...f, city: e.target.value })} />
          <Field label="State" value={f.state} onChange={e => setF({ ...f, state: e.target.value })} />
          <Field label="Zip" value={f.zip} onChange={e => setF({ ...f, zip: e.target.value })} />
        </div>
        <Field label="Price" type="number" value={f.price} onChange={e => setF({ ...f, price: e.target.value })} />
        <div className="grid grid-cols-3 gap-2">
          <Field label="Beds" type="number" value={f.beds} onChange={e => setF({ ...f, beds: e.target.value })} />
          <Field label="Baths" type="number" value={f.baths} onChange={e => setF({ ...f, baths: e.target.value })} />
          <Field label="Sqft" type="number" value={f.sqft} onChange={e => setF({ ...f, sqft: e.target.value })} />
        </div>
        <Select label="Status" options={["active", "pending", "sold"]} value={f.status} onChange={e => setF({ ...f, status: e.target.value })} />
        <Field label="Notes" value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} />
        <button onClick={submit} className="w-full rounded bg-indigo-600 text-white py-2 text-sm font-medium hover:bg-indigo-700">Save</button>
      </div>
      <div className="md:col-span-2 space-y-2">
        {rows.length === 0 && <p className="text-slate-400 text-sm">No properties yet.</p>}
        {rows.map(r => (
          <div key={r.id} className="bg-white rounded-lg shadow-sm p-3 flex items-start justify-between">
            <div>
              <div className="font-medium text-slate-800">{r.address}
                <span className="ml-2 text-xs rounded-full bg-indigo-50 px-2 py-0.5 text-indigo-600">{r.status}</span>
              </div>
              <div className="text-sm text-slate-500">{[r.city, r.state, r.zip].filter(Boolean).join(", ")}</div>
              <div className="text-sm text-slate-600 mt-1">{money(r.price)} {r.beds ? "· " + r.beds + " bd" : ""} {r.baths ? "· " + r.baths + " ba" : ""} {r.sqft ? "· " + r.sqft + " sqft" : ""}</div>
            </div>
            <button onClick={() => remove(r.id)} className="text-slate-300 hover:text-red-500 text-sm">✕</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- Deals (pipeline) ----------
const STAGES = ["new", "showing", "offer", "contract", "closed"];
function Deals() {
  const { rows, add, update, remove } = useTable("deals");
  const blank = { title: "", stage: "new", value: "" };
  const [f, setF] = useState(blank);
  const submit = () => { if (!f.title) return; add({ ...f, value: f.value || null }); setF(blank); };
  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl shadow p-4 flex flex-wrap items-end gap-3">
        <div className="flex-1 min-w-[200px]"><Field label="New deal title" value={f.title} onChange={e => setF({ ...f, title: e.target.value })} /></div>
        <div className="w-32"><Field label="Value" type="number" value={f.value} onChange={e => setF({ ...f, value: e.target.value })} /></div>
        <button onClick={submit} className="rounded bg-indigo-600 text-white px-4 py-2 text-sm font-medium hover:bg-indigo-700">Add</button>
      </div>
      <div className="grid md:grid-cols-5 gap-3">
        {STAGES.map(stage => (
          <div key={stage} className="bg-slate-50 rounded-xl p-2 min-h-[120px]">
            <div className="text-xs font-semibold uppercase tracking-wide text-slate-500 px-1 py-1 capitalize">{stage}</div>
            {rows.filter(r => r.stage === stage).map(r => (
              <div key={r.id} className="bg-white rounded-lg shadow-sm p-2 mb-2">
                <div className="text-sm font-medium text-slate-800">{r.title}</div>
                <div className="text-xs text-slate-500">{money(r.value)}</div>
                <div className="flex items-center justify-between mt-2">
                  <select value={r.stage} onChange={e => update(r.id, { stage: e.target.value })} className="text-xs border border-slate-200 rounded px-1 py-0.5">
                    {STAGES.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                  <button onClick={() => remove(r.id)} className="text-slate-300 hover:text-red-500 text-xs">✕</button>
                </div>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- Tasks ----------
function Tasks() {
  const { rows, add, update, remove } = useTable("tasks");
  const blank = { title: "", due_date: "" };
  const [f, setF] = useState(blank);
  const submit = () => { if (!f.title) return; add({ ...f, due_date: f.due_date || null }); setF(blank); };
  return (
    <div className="max-w-2xl space-y-4">
      <div className="bg-white rounded-xl shadow p-4 flex flex-wrap items-end gap-3">
        <div className="flex-1 min-w-[200px]"><Field label="Task" value={f.title} onChange={e => setF({ ...f, title: e.target.value })} /></div>
        <div className="w-40"><Field label="Due" type="date" value={f.due_date} onChange={e => setF({ ...f, due_date: e.target.value })} /></div>
        <button onClick={submit} className="rounded bg-indigo-600 text-white px-4 py-2 text-sm font-medium hover:bg-indigo-700">Add</button>
      </div>
      <div className="space-y-2">
        {rows.length === 0 && <p className="text-slate-400 text-sm">No tasks yet.</p>}
        {rows.map(r => (
          <div key={r.id} className="bg-white rounded-lg shadow-sm p-3 flex items-center gap-3">
            <input type="checkbox" checked={r.done} onChange={e => update(r.id, { done: e.target.checked })} className="h-4 w-4" />
            <div className="flex-1">
              <div className={cls("text-sm text-slate-800", r.done && "line-through text-slate-400")}>{r.title}</div>
              {r.due_date && <div className="text-xs text-slate-400">Due {r.due_date}</div>}
            </div>
            <button onClick={() => remove(r.id)} className="text-slate-300 hover:text-red-500 text-sm">✕</button>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- App shell ----------
const TABS = [["contacts", "Contacts"], ["properties", "Properties"], ["deals", "Pipeline"], ["tasks", "Tasks"]];
function App({ session }) {
  const [tab, setTab] = useState("contacts");
  return (
    <div className="min-h-screen">
      <header className="bg-white border-b border-slate-200">
        <div className="max-w-6xl mx-auto px-4 flex items-center justify-between h-14">
          <div className="font-bold text-slate-800">🏠 Real Estate CRM</div>
          <div className="flex items-center gap-4">
            <span className="text-sm text-slate-500 hidden sm:inline">{session.user.email}</span>
            <button onClick={() => sb.auth.signOut()} className="text-sm text-slate-500 hover:text-slate-800">Sign out</button>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-4 flex gap-1">
          {TABS.map(([key, label]) => (
            <button key={key} onClick={() => setTab(key)}
              className={cls("px-3 py-2 text-sm font-medium border-b-2 -mb-px",
                tab === key ? "border-indigo-600 text-indigo-600" : "border-transparent text-slate-500 hover:text-slate-800")}>
              {label}
            </button>
          ))}
        </div>
      </header>
      <main className="max-w-6xl mx-auto px-4 py-6">
        {tab === "contacts" && <Contacts />}
        {tab === "properties" && <Properties />}
        {tab === "deals" && <Deals />}
        {tab === "tasks" && <Tasks />}
      </main>
    </div>
  );
}

// ---------- root: watch auth state ----------
function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div className="min-h-screen flex items-center justify-center text-slate-400">Loading…</div>;
  return session ? <App session={session} /> : <Login />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
