<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ---------- helpers ----------
const money = (n) => (n || n === 0) ? "$" + Number(n).toLocaleString() : "";
const cls = (...a) => a.filter(Boolean).join(" ");

const BADGE = {
  // contact type
  lead: "bg-amber-100 text-amber-700", buyer: "bg-sky-100 text-sky-700", seller: "bg-violet-100 text-violet-700",
  // status
  new: "bg-slate-100 text-slate-600", active: "bg-emerald-100 text-emerald-700", closed: "bg-slate-200 text-slate-500",
  pending: "bg-amber-100 text-amber-700", sold: "bg-emerald-100 text-emerald-700",
  // deal stage
  showing: "bg-sky-100 text-sky-700", offer: "bg-amber-100 text-amber-700", contract: "bg-violet-100 text-violet-700",
};
const Badge = ({ v }) => v ? <span className={cls("text-xs rounded-full px-2 py-0.5 font-medium capitalize", BADGE[v] || "bg-slate-100 text-slate-600")}>{v}</span> : null;

function Field({ label, ...props }) {
  return (
    <label className="block text-sm">
      <span className="text-slate-500 font-medium">{label}</span>
      <input {...props} className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none" />
    </label>
  );
}
function Select({ label, children, ...props }) {
  return (
    <label className="block text-sm">
      <span className="text-slate-500 font-medium">{label}</span>
      <select {...props} className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:border-indigo-500 focus:outline-none">
        {children}
      </select>
    </label>
  );
}
const Btn = (p) => <button {...p} className={cls("rounded-lg bg-indigo-600 text-white px-4 py-2 text-sm font-semibold hover:bg-indigo-700 shadow-sm transition", p.className)} />;
const Card = ({ children, className }) => <div className={cls("bg-white rounded-xl shadow-sm border border-slate-100", className)}>{children}</div>;

// ---------- login ----------
function Login() {
  const [email, setEmail] = useState("");
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState("");
  const send = async () => {
    setErr("");
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
    if (error) setErr(error.message); else setSent(true);
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-50 to-slate-100">
      <Card className="w-full max-w-sm p-7">
        <div className="text-3xl">🏡</div>
        <h1 className="text-xl font-bold mt-2">Real Estate CRM</h1>
        <p className="text-sm text-slate-500 mt-1">Sign in with your email — we'll send a magic link.</p>
        {sent ? (
          <p className="mt-5 text-sm text-emerald-700 bg-emerald-50 rounded-lg p-3">Check your inbox and click the link to sign in.</p>
        ) : (
          <div className="mt-5 space-y-3">
            <Field label="Email" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@email.com" />
            <Btn onClick={send} className="w-full">Send magic link</Btn>
            {err && <p className="text-sm text-red-600">{err}</p>}
          </div>
        )}
      </Card>
    </div>
  );
}

// ---------- data hook ----------
function useTable(name, order = "created_at") {
  const [rows, setRows] = useState([]);
  const load = async () => {
    const { data } = await sb.from(name).select("*").order(order, { ascending: false });
    setRows(data || []);
  };
  useEffect(() => { load(); }, []);
  const add = async (row) => { await sb.from(name).insert(row); load(); };
  const update = async (id, patch) => { await sb.from(name).update(patch).eq("id", id); load(); };
  const remove = async (id) => { await sb.from(name).delete().eq("id", id); load(); };
  return { rows, add, update, remove, reload: load };
}
const nameById = (list, id) => (list.find(x => x.id === id) || {});

// ---------- Contacts ----------
function Contacts() {
  const { rows, add, update, remove } = useTable("contacts");
  const blank = { name: "", email: "", phone: "", type: "lead", status: "new", notes: "" };
  const [f, setF] = useState(blank);
  const [editing, setEditing] = useState(null);
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");

  const submit = () => {
    if (!f.name) return;
    if (editing) { update(editing, f); setEditing(null); } else { add(f); }
    setF(blank);
  };
  const startEdit = (r) => { setEditing(r.id); setF({ name: r.name, email: r.email || "", phone: r.phone || "", type: r.type, status: r.status, notes: r.notes || "" }); window.scrollTo(0, 0); };

  const shown = rows.filter(r =>
    (filter === "all" || r.type === filter) &&
    (r.name + (r.email || "") + (r.phone || "")).toLowerCase().includes(q.toLowerCase()));

  return (
    <div className="grid lg:grid-cols-3 gap-5">
      <Card className="p-5 space-y-3 h-fit">
        <h3 className="font-semibold">{editing ? "Edit contact" : "Add contact"}</h3>
        <Field label="Name" value={f.name} onChange={e => setF({ ...f, name: e.target.value })} />
        <Field label="Email" value={f.email} onChange={e => setF({ ...f, email: e.target.value })} />
        <Field label="Phone" value={f.phone} onChange={e => setF({ ...f, phone: e.target.value })} />
        <div className="grid grid-cols-2 gap-2">
          <Select label="Type" value={f.type} onChange={e => setF({ ...f, type: e.target.value })}>
            {["lead", "buyer", "seller"].map(o => <option key={o}>{o}</option>)}
          </Select>
          <Select label="Status" value={f.status} onChange={e => setF({ ...f, status: e.target.value })}>
            {["new", "active", "closed"].map(o => <option key={o}>{o}</option>)}
          </Select>
        </div>
        <Field label="Notes" value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} />
        <div className="flex gap-2">
          <Btn onClick={submit} className="flex-1">{editing ? "Save changes" : "Add contact"}</Btn>
          {editing && <button onClick={() => { setEditing(null); setF(blank); }} className="rounded-lg px-4 py-2 text-sm text-slate-500 hover:bg-slate-100">Cancel</button>}
        </div>
      </Card>

      <div className="lg:col-span-2 space-y-3">
        <div className="flex flex-wrap gap-2">
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search contacts…" className="flex-1 min-w-[160px] rounded-lg border border-slate-300 px-3 py-2 text-sm" />
          <Select value={filter} onChange={e => setFilter(e.target.value)}>
            {["all", "lead", "buyer", "seller"].map(o => <option key={o} value={o}>{o === "all" ? "All types" : o}</option>)}
          </Select>
        </div>
        {shown.length === 0 && <p className="text-slate-400 text-sm py-6 text-center">No contacts found.</p>}
        {shown.map(r => (
          <Card key={r.id} className="p-4 flex items-start justify-between hover:shadow-md transition">
            <div>
              <div className="font-medium flex items-center gap-2 flex-wrap">{r.name} <Badge v={r.type} /> <Badge v={r.status} /></div>
              <div className="text-sm text-slate-500 mt-0.5">{[r.email, r.phone].filter(Boolean).join(" · ")}</div>
              {r.notes && <div className="text-sm text-slate-400 mt-1">{r.notes}</div>}
            </div>
            <div className="flex gap-1 shrink-0">
              <button onClick={() => startEdit(r)} className="text-slate-400 hover:text-indigo-600 text-sm px-1">Edit</button>
              <button onClick={() => remove(r.id)} className="text-slate-300 hover:text-red-500 text-sm px-1">✕</button>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ---------- Properties ----------
function Properties() {
  const { rows, add, update, remove } = useTable("properties");
  const blank = { address: "", city: "", state: "", zip: "", price: "", status: "active", beds: "", baths: "", sqft: "", notes: "" };
  const [f, setF] = useState(blank);
  const [editing, setEditing] = useState(null);
  const [q, setQ] = useState("");

  const clean = (o) => ({ ...o, price: o.price || null, beds: o.beds || null, baths: o.baths || null, sqft: o.sqft || null });
  const submit = () => {
    if (!f.address) return;
    if (editing) { update(editing, clean(f)); setEditing(null); } else { add(clean(f)); }
    setF(blank);
  };
  const startEdit = (r) => { setEditing(r.id); setF({ address: r.address, city: r.city || "", state: r.state || "", zip: r.zip || "", price: r.price || "", status: r.status, beds: r.beds || "", baths: r.baths || "", sqft: r.sqft || "", notes: r.notes || "" }); window.scrollTo(0, 0); };
  const shown = rows.filter(r => (r.address + (r.city || "")).toLowerCase().includes(q.toLowerCase()));

  return (
    <div className="grid lg:grid-cols-3 gap-5">
      <Card className="p-5 space-y-3 h-fit">
        <h3 className="font-semibold">{editing ? "Edit property" : "Add property"}</h3>
        <Field label="Address" value={f.address} onChange={e => setF({ ...f, address: e.target.value })} />
        <div className="grid grid-cols-3 gap-2">
          <Field label="City" value={f.city} onChange={e => setF({ ...f, city: e.target.value })} />
          <Field label="State" value={f.state} onChange={e => setF({ ...f, state: e.target.value })} />
          <Field label="Zip" value={f.zip} onChange={e => setF({ ...f, zip: e.target.value })} />
        </div>
        <Field label="Price" type="number" value={f.price} onChange={e => setF({ ...f, price: e.target.value })} />
        <div className="grid grid-cols-3 gap-2">
          <Field label="Beds" type="number" value={f.beds} onChange={e => setF({ ...f, beds: e.target.value })} />
          <Field label="Baths" type="number" value={f.baths} onChange={e => setF({ ...f, baths: e.target.value })} />
          <Field label="Sqft" type="number" value={f.sqft} onChange={e => setF({ ...f, sqft: e.target.value })} />
        </div>
        <Select label="Status" value={f.status} onChange={e => setF({ ...f, status: e.target.value })}>
          {["active", "pending", "sold"].map(o => <option key={o}>{o}</option>)}
        </Select>
        <Field label="Notes" value={f.notes} onChange={e => setF({ ...f, notes: e.target.value })} />
        <div className="flex gap-2">
          <Btn onClick={submit} className="flex-1">{editing ? "Save changes" : "Add property"}</Btn>
          {editing && <button onClick={() => { setEditing(null); setF(blank); }} className="rounded-lg px-4 py-2 text-sm text-slate-500 hover:bg-slate-100">Cancel</button>}
        </div>
      </Card>

      <div className="lg:col-span-2 space-y-3">
        <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search properties…" className="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        {shown.length === 0 && <p className="text-slate-400 text-sm py-6 text-center">No properties found.</p>}

          <Card key={r.id} className="p-4 flex items-start justify-between hover:shadow-md transition">

              <div className="font-medium flex items-center gap-2 flex-wrap">{r.address} <Badge v={r.status} /></div>

              <div className="text-sm text-slate-600 mt-1 font-medium">{money(r.price)} <span className="font-normal text-slate-400">{r.beds ? "· " + r.beds + " bd" : ""} {r.baths ? "· " + r.baths + " ba" : ""} {r.sqft ? "· " + r.sqft + " sqft" : ""}</span></div>
            </div>
            <div className="flex gap-1 shrink-0">
              <button onClick={() => startEdit(r)} className="text-slate-400 hover:text-indigo-600 text-sm px-1">Edit</button>
              <button onClick={() => remove(r.id)} className="text-slate-300 hover:text-red-500 text-sm px-1">✕</button>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ---------- Deals (pipeline, linked to contact + property) ----------
const STAGES = ["new", "showing", "offer", "contract", "closed"];
function Deals() {
  const { rows, add, update, remove } = useTable("deals");
  const contacts = useTable("contacts").rows;
  const properties = useTable("properties").rows;
  const blank = { title: "", stage: "new", value: "", contact_id: "", property_id: "" };
  const [f, setF] = useState(blank);
  const clean = (o) => ({ ...o, value: o.value || null, contact_id: o.contact_id || null, property_id: o.property_id || null });
  const submit = () => { if (!f.title) return; add(clean(f)); setF(blank); };

  return (
    <div className="space-y-5">
      <Card className="p-5">
        <h3 className="font-semibold mb-3">New deal</h3>
        <div className="grid md:grid-cols-5 gap-3">
          <Field label="Title" value={f.title} onChange={e => setF({ ...f, title: e.target.value })} />
          <Field label="Value" type="number" value={f.value} onChange={e => setF({ ...f, value: e.target.value })} />
          <Select label="Contact" value={f.contact_id} onChange={e => setF({ ...f, contact_id: e.target.value })}>
            <option value="">— none —</option>
            {contacts.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </Select>
          <Select label="Property" value={f.property_id} onChange={e => setF({ ...f, property_id: e.target.value })}>
            <option value="">— none —</option>
            {properties.map(p => <option key={p.id} value={p.id}>{p.address}</option>)}
          </Select>
          <div className="flex items-end"><Btn onClick={submit} className="w-full">Add deal</Btn></div>
        </div>
      </Card>

      <div className="grid md:grid-cols-5 gap-3">
        {STAGES.map(stage => {
          const col = rows.filter(r => r.stage === stage);
          const sum = col.reduce((a, r) => a + (Number(r.value) || 0), 0);
          return (
            <div key={stage} className="bg-slate-100 rounded-xl p-2.5 min-h-[140px]">
              <div className="flex items-center justify-between px-1 pb-2">
                <span className="text-xs font-bold uppercase tracking-wide text-slate-500 capitalize">{stage}</span>
                <span className="text-xs text-slate-400">{col.length}</span>
              </div>
              {sum > 0 && <div className="text-xs text-slate-400 px-1 pb-1">{money(sum)}</div>}
              {col.map(r => (
                <Card key={r.id} className="p-2.5 mb-2">
                  <div className="text-sm font-medium">{r.title}</div>
                  {r.value && <div className="text-xs text-emerald-600 font-semibold">{money(r.value)}</div>}
                  {r.contact_id && <div className="text-xs text-slate-500 mt-1">👤 {nameById(contacts, r.contact_id).name || "—"}</div>}
                  {r.property_id && <div className="text-xs text-slate-500">🏠 {nameById(properties, r.property_id).address || "—"}</div>}
                  <div className="flex items-center justify-between mt-2">
                    <select value={r.stage} onChange={e => update(r.id, { stage: e.target.value })} className="text-xs border border-slate-200 rounded px-1 py-0.5 bg-white">
                      {STAGES.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                    <button onClick={() => remove(r.id)} className="text-slate-300 hover:text-red-500 text-xs">✕</button>
                  </div>
                </Card>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Tasks (linked to contact + deal) ----------
function Tasks() {
  const { rows, add, update, remove } = useTable("tasks");
  const contacts = useTable("contacts").rows;
  const deals = useTable("deals").rows;
  const blank = { title: "", due_date: "", contact_id: "", deal_id: "" };
  const [f, setF] = useState(blank);
  const clean = (o) => ({ ...o, due_date: o.due_date || null, contact_id: o.contact_id || null, deal_id: o.deal_id || null });
  const submit = () => { if (!f.title) return; add(clean(f)); setF(blank); };
  const open = rows.filter(r => !r.done), done = rows.filter(r => r.done);

  const Row = (r) => (
    <Card key={r.id} className="p-3 flex items-center gap-3">
      <input type="checkbox" checked={r.done} onChange={e => update(r.id, { done: e.target.checked })} className="h-4 w-4 accent-indigo-600" />
      <div className="flex-1">
        <div className={cls("text-sm", r.done && "line-through text-slate-400")}>{r.title}</div>
        <div className="text-xs text-slate-400 flex gap-2 flex-wrap">
          {r.due_date && <span>📅 {r.due_date}</span>}
          {r.contact_id && <span>👤 {nameById(contacts, r.contact_id).name}</span>}
          {r.deal_id && <span>💼 {nameById(deals, r.deal_id).title}</span>}
        </div>
      </div>
      <button onClick={() => remove(r.id)} className="text-slate-300 hover:text-red-500 text-sm">✕</button>
    </Card>
  );

  return (
    <div className="max-w-3xl space-y-4">
      <Card className="p-5">
        <div className="grid md:grid-cols-4 gap-3">
          <Field label="Task" value={f.title} onChange={e => setF({ ...f, title: e.target.value })} />
          <Field label="Due date" type="date" value={f.due_date} onChange={e => setF({ ...f, due_date: e.target.value })} />
          <Select label="Contact" value={f.contact_id} onChange={e => setF({ ...f, contact_id: e.target.value })}>
            <option value="">— none —</option>
            {contacts.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </Select>
          <Select label="Deal" value={f.deal_id} onChange={e => setF({ ...f, deal_id: e.target.value })}>
            <option value="">— none —</option>
            {deals.map(d => <option key={d.id} value={d.id}>{d.title}</option>)}
          </Select>
        </div>
        <Btn onClick={submit} className="mt-3">Add task</Btn>
      </Card>
      <div className="space-y-2">
        {open.length === 0 && <p className="text-slate-400 text-sm">No open tasks.</p>}
        {open.map(Row)}
        {done.length > 0 && <div className="text-xs font-semibold uppercase text-slate-400 pt-3">Completed</div>}
        {done.map(Row)}
      </div>
    </div>
  );
}

// ---------- Dashboard ----------
function Stat({ label, value, accent }) {
  return (
    <Card className="p-5">
      <div className={cls("text-3xl font-bold", accent)}>{value}</div>
      <div className="text-sm text-slate-500 mt-1">{label}</div>
    </Card>
  );
}
function Dashboard({ go }) {
  const contacts = useTable("contacts").rows;
  const properties = useTable("properties").rows;
  const deals = useTable("deals").rows;
  const tasks = useTable("tasks").rows;
  const pipeline = deals.filter(d => d.stage !== "closed").reduce((a, d) => a + (Number(d.value) || 0), 0);
  const openTasks = tasks.filter(t => !t.done);
  return (
    <div className="space-y-5">
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <Stat label="Contacts" value={contacts.length} accent="text-indigo-600" />
        <Stat label="Active listings" value={properties.filter(p => p.status === "active").length} accent="text-sky-600" />
        <Stat label="Open deals" value={deals.filter(d => d.stage !== "closed").length} accent="text-violet-600" />
        <Stat label="Pipeline value" value={money(pipeline) || "$0"} accent="text-emerald-600" />
      </div>
      <div className="grid lg:grid-cols-2 gap-5">
        <Card className="p-5">
          <h3 className="font-semibold mb-3">Deals by stage</h3>
          {STAGES.map(s => {
            const n = deals.filter(d => d.stage === s).length;
            const pct = deals.length ? (n / deals.length) * 100 : 0;
            return (
              <div key={s} className="mb-2">
                <div className="flex justify-between text-xs text-slate-500 capitalize"><span>{s}</span><span>{n}</span></div>
                <div className="h-2 bg-slate-100 rounded-full mt-1"><div className="h-2 bg-indigo-500 rounded-full" style={{ width: pct + "%" }}></div></div>
              </div>
            );
          })}
        </Card>
        <Card className="p-5">
          <h3 className="font-semibold mb-3">Upcoming tasks</h3>
          {openTasks.length === 0 && <p className="text-sm text-slate-400">Nothing open. 🎉</p>}
          {openTasks.slice(0, 6).map(t => (
            <div key={t.id} className="flex justify-between text-sm py-1.5 border-b border-slate-50 last:border-0">
              <span>{t.title}</span><span className="text-slate-400 text-xs">{t.due_date || ""}</span>
            </div>
          ))}
          <button onClick={() => go("tasks")} className="text-indigo-600 text-sm mt-3 hover:underline">View all tasks →</button>
        </Card>
      </div>
    </div>
  );
}

function App({ session }) {

  return (
    <div className="min-h-screen">
      <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div className="max-w-6xl mx-auto px-4 flex items-center justify-between h-14">
          <div className="font-bold flex items-center gap-2">🏡 Real Estate CRM</div>
          <div className="flex items-center gap-4">
            <span className="text-sm text-slate-500 hidden sm:inline">{session.user.email}</span>
            <button onClick={() => sb.auth.signOut()} className="text-sm text-slate-500 hover:text-slate-800">Sign out</button>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto">
          {TABS.map(([key, label]) => (
            <button key={key} onClick={() => setTab(key)}
              className={cls("px-3 py-2.5 text-sm font-medium border-b-2 -mb-px whitespace-nowrap",
                tab === key ? "border-indigo-600 text-indigo-600" : "border-transparent text-slate-500 hover:text-slate-800")}>
              {label}
            </button>
          ))}
        </div>
      </header>
      <main className="max-w-6xl mx-auto px-4 py-6">
        {tab === "dashboard" && <Dashboard go={setTab} />}
        {tab === "contacts" && <Contacts />}
        {tab === "properties" && <Properties />}
        {tab === "deals" && <Deals />}
        {tab === "tasks" && <Tasks />}
      </main>
    </div>
  );
}

function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <div className="min-h-screen flex items-center justify-center text-slate-400">Loading…</div>;
  return session ? <App session={session} /> : <Login />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
